stages:
  - lint
  - test
  - build
  - manifests

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

.python: &python
  image: python:3.10-slim
  before_script:
    - pip install -r requirements-dev.txt

lint:
  <<: *python
  stage: lint
  script:
    # Scoped to the serving stack; the legacy training/CLI code (train.py,
    # predict.py, unet/, utils/) predates this and isn't covered here.
    - ruff check app.py batcher.py conftest.py tests/

test:
  <<: *python
  stage: test
  script:
    - pytest tests/ -v

docker-build:
  stage: build
  image: docker:26
  services:
    - docker:26-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t oct-segmentation:ci .

validate-manifests:
  stage: manifests
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - kubectl kustomize k8s > rendered.yaml
    - curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
    - ./kubeconform -strict -summary rendered.yaml
