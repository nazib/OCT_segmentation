apiVersion: v1
kind: Service
metadata:
  name: oct-segmentation
  labels:
    app.kubernetes.io/name: oct-segmentation
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: oct-segmentation
  ports:
    - name: http
      port: 80
      targetPort: http
